<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite Studio</title>
<style>
  :root {
    --bg: #121315; --panel: #1a1c1f; --panel2: #202327; --line: #2c3036; --text: #d9d6cf; --dim: #8b8a86;
    --accent: #e0703a; --accent2: #f0a35e; --ok: #7fb069; --warn: #e6b450; --bad: #e0564a; --cyan: #4fc3d9;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-columns: 290px minmax(0, 1fr) 330px; grid-template-rows: 46px minmax(0, 1fr) auto; height: 100vh; overflow: hidden; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #0d0e10; border-bottom: 1px solid var(--line); }
  header .brand { font-weight: 700; letter-spacing: .08em; font-size: 12px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  header .brand i { width: 14px; height: 14px; background: var(--accent); display: inline-block; box-shadow: 4px 4px 0 #6b2f17; }
  header .sp { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; }
  .seg button.on { background: var(--accent); color: #140b06; }
  button, select, input[type=text], input[type=number] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 5px 9px; font: inherit;
  }
  button { cursor: pointer; white-space: nowrap; }
  button:hover { border-color: #4a4f57; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #140b06; font-weight: 600; }
  button.ghost { background: transparent; }
  select { padding: 4px 6px; }
  input[type=number] { width: 64px; padding: 4px 6px; }
  input[type=color] { width: 30px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  aside { overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 6px 0 40px; }
  aside.right { border-right: 0; border-left: 1px solid var(--line); }
  details { border-bottom: 1px solid var(--line); }
  details > summary { cursor: pointer; padding: 9px 14px; font-weight: 600; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); list-style: none; display: flex; justify-content: space-between; }
  details > summary::after { content: '+'; }
  details[open] > summary::after { content: '–'; }
  details[open] > summary { color: var(--text); }
  .body { padding: 2px 14px 12px; display: grid; gap: 7px; }
  .row { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; align-items: center; gap: 8px; }
  .row > label { color: var(--dim); font-size: 12px; }
  .row .val { font-family: var(--mono); font-size: 11px; color: var(--dim); min-width: 30px; text-align: right; }
  .row select { width: 100%; }
  .check { display: flex; align-items: center; gap: 7px; color: var(--text); font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  main { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .toolbar .lbl { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-left: 6px; }
  .stage { position: relative; overflow: auto; display: grid; place-items: center; min-height: 0; }
  #view { image-rendering: pixelated; display: block; box-shadow: 0 0 0 1px #000, 0 8px 30px #0008; }
  .mini { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 10px; align-items: flex-end; background: #0d0e10cc; padding: 8px; border: 1px solid var(--line); border-radius: 6px; }
  .mini figure { margin: 0; text-align: center; }
  .mini figcaption { font-size: 10px; color: var(--dim); font-family: var(--mono); }
  .mini canvas { image-rendering: pixelated; display: block; }
  .badge { position: absolute; left: 10px; top: 10px; font-family: var(--mono); font-size: 11px; background: #0d0e10cc; border: 1px solid var(--line); padding: 4px 8px; border-radius: 5px; color: var(--dim); }
  .badge b { color: var(--text); font-weight: 600; }
  footer { grid-column: 2; border-top: 1px solid var(--line); background: var(--panel); padding: 8px 10px 10px; min-width: 0; }
  .transport { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .transport .info { font-family: var(--mono); font-size: 12px; color: var(--dim); margin-left: 6px; }
  .transport .info b { color: var(--text); }
  .strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .cell { flex: none; border: 1px solid var(--line); border-radius: 5px; background: var(--panel2); padding: 4px 4px 2px; cursor: pointer; text-align: center; }
  .cell canvas { image-rendering: pixelated; display: block; }
  .cell.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .cell .ms { font-family: var(--mono); font-size: 10px; color: var(--dim); border: 0; background: transparent; width: 46px; text-align: center; padding: 1px; }
  .cell .kind { font-size: 9px; font-family: var(--mono); height: 12px; }
  .k-sub-pixel { color: var(--cyan); } .k-whole-pixel { color: var(--ok); } .k-jump-cut { color: var(--bad); } .k-duplicate { color: var(--warn); }
  .anims { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .anims button { text-align: left; font-size: 12px; padding: 5px 8px; }
  .anims button.on { border-color: var(--accent); color: var(--accent2); background: #2a1d16; }
  .compass { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 34px); gap: 4px; justify-content: center; }
  .compass button { padding: 0; font-family: var(--mono); font-size: 11px; }
  .compass button.on { background: var(--accent); color: #140b06; border-color: var(--accent); }
  .compass .c { display: grid; place-items: center; color: var(--dim); font-size: 10px; }
  .sync { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .sync figure { margin: 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 3px; text-align: center; cursor: pointer; }
  .sync figure.on { border-color: var(--accent); }
  .sync canvas { image-rendering: pixelated; display: block; margin: 0 auto; }
  .sync figcaption { font: 10px var(--mono); color: var(--dim); }
  table.metrics { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; }
  table.metrics th, table.metrics td { padding: 2px 4px; text-align: right; border-bottom: 1px solid #23262b; }
  table.metrics th { color: var(--dim); font-weight: 500; }
  table.metrics tr.on td { background: #2a1d16; }
  table.metrics td.k { text-align: left; }
  .problems { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  .problems li { font-size: 11.5px; padding: 5px 7px; border-radius: 4px; background: #241c1a; border-left: 3px solid var(--warn); }
  .problems li.s3, .problems li.s2 { border-left-color: var(--bad); }
  .problems li.ok { background: #1b231a; border-left-color: var(--ok); }
  .note { color: var(--dim); font-size: 11.5px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .drop { border: 1px dashed #4a4f57; border-radius: 6px; padding: 12px; text-align: center; color: var(--dim); font-size: 12px; }
  .drop.hot { border-color: var(--accent); color: var(--text); }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #0d0e10; border: 1px solid var(--accent); color: var(--text); padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
  .toast.on { opacity: 1; }
  .busy { position: fixed; inset: 0; background: #000a; display: none; place-items: center; z-index: 8; font-family: var(--mono); }
  .busy.on { display: grid; }
  .hidden { display: none !important; }
  kbd { font-family: var(--mono); font-size: 10px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: var(--dim); }
  @media (max-width: 1100px) {
    body { grid-template-columns: 1fr; grid-template-rows: 46px auto 60vh auto auto; height: auto; overflow: auto; }
    aside, aside.right { border: 0; max-height: none; overflow: visible; }
    footer { grid-column: 1; }
    main { min-height: 60vh; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>Sprite Studio</div>
  <div class="seg" id="modeSeg"><button data-mode="gen" class="on">Generate</button><button data-mode="inspect">Inspect file</button><button data-mode="video">Video → Sheet</button></div>
  <span class="sp"></span>
  <select id="preset" title="Load a preset"></select>
  <button id="randomBtn" title="Random outfit">Randomise</button>
  <button id="saveBtn" title="Download the character as JSON">Save JSON</button>
  <button id="loadBtn" title="Load a character JSON">Load JSON</button>
  <input type="file" id="loadFile" accept=".json" class="hidden">
</header>

<aside id="left">
  <div id="genPanel"></div>
  <div id="inspectPanel" class="hidden"></div>
  <div id="videoPanel" class="hidden"></div>
</aside>

<main>
  <div class="toolbar">
    <span class="lbl">Zoom</span>
    <select id="zoom"></select>
    <span class="lbl">Bg</span>
    <select id="bg">
      <option value="checker">Checker</option><option value="grey">Mid grey</option><option value="day">Day (dirt)</option>
      <option value="night">Night</option><option value="magenta">Magenta</option>
    </select>
    <label class="check"><input type="checkbox" id="onion"> Onion</label>
    <label class="check"><input type="checkbox" id="diff"> Diff</label>
    <label class="check"><input type="checkbox" id="guides" checked> Guides</label>
    <label class="check"><input type="checkbox" id="grid"> Grid</label>
    <label class="check"><input type="checkbox" id="orph"> Orphans</label>
    <span class="lbl">Ref</span>
    <button id="refBtn" title="Overlay a reference drawing, feet on the ground row">Load…</button>
    <input type="range" id="refAlpha" min="0" max="1" step="0.05" value="0.5" style="width:70px" title="Reference opacity">
    <input type="file" id="refFile" accept="image/*" class="hidden">
  </div>
  <div class="stage" id="stage">
    <canvas id="view"></canvas>
    <div class="badge" id="badge"></div>
    <div class="mini"><figure><canvas id="mini1"></canvas><figcaption>1x</figcaption></figure><figure><canvas id="mini2"></canvas><figcaption>2x</figcaption></figure></div>
  </div>
</main>

<aside class="right" id="right">
  <details open id="animBox"><summary>Animation</summary><div class="body">
    <div class="anims" id="anims"></div>
    <div id="animParams" class="body" style="padding:4px 0 0"></div>
  </div></details>
  <details open><summary>Direction</summary><div class="body">
    <div class="compass" id="compass"></div>
    <div class="sync" id="sync"></div>
    <div class="note">All eight directions are rendered from the same 3D pose, so they stay in sync frame for frame.</div>
  </div></details>
  <details open><summary>Check</summary><div class="body">
    <table class="metrics" id="metrics"></table>
    <ul class="problems" id="problems"></ul>
  </div></details>
  <details open id="exportBox"><summary>Export</summary><div class="body" id="exportBody"></div></details>
</aside>

<footer>
  <div class="transport">
    <button id="first" title="First frame (Home)">⏮</button>
    <button id="prev" title="Previous frame (←)">◀</button>
    <button id="play" class="primary" title="Play / pause (Space)">❚❚</button>
    <button id="next" title="Next frame (→)">▶</button>
    <button id="last" title="Last frame (End)">⏭</button>
    <select id="speed" title="Playback speed"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
    <select id="loopMode" title="Loop mode"><option value="auto">Loop: as authored</option><option value="loop">Loop</option><option value="ping">Ping-pong</option><option value="once">Once</option></select>
    <span class="info" id="tinfo"></span>
    <span class="sp" style="flex:1"></span>
    <span class="note"><kbd>Space</kbd> play <kbd>←</kbd><kbd>→</kbd> step <kbd>A</kbd><kbd>D</kbd> turn <kbd>O</kbd> onion <kbd>F</kbd> diff</span>
  </div>
  <div class="strip" id="strip"></div>
</footer>

<div class="toast" id="toast"></div>
<div class="busy" id="busy"><div id="busyText">Rendering…</div></div>

<script src="js/core.js"></script>
<script src="js/model.js"></script>
<script src="js/pose.js"></script>
<script src="js/build.js"></script>
<script src="js/render.js"></script>
<script src="js/analyze.js"></script>
<script src="js/io.js"></script>
<script src="js/parts.js"></script>
<script src="js/vidsheet.js"></script>
<script src="js/app.js"></script>
<script src="js/vidpanel.js"></script>
</body>
</html>
